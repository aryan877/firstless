[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "write", path = "../../apps/web/public/deployments" },
  { access = "write", path = "./.local" },
]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
