<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">What happens to one Firstless order</title>
  <desc id="desc">Alice signs for exactly 10 fETH with a maximum input. The output arrives immediately and the maximum is held. Same-block opposing flow nets before the residual reaches the curve. In the next block Alice pays her marginal bill and receives the unused maximum as a refund.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f5ee"/>
      <stop offset="1" stop-color="#e7e9e2"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#171814" flood-opacity=".10"/>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .ink{fill:#171814}
      .muted{fill:#696d66}
      .card{fill:#fffefa;stroke:#d0d3ca;stroke-width:2}
      .step{font-size:16px}
      .card-title{font-size:28px;font-weight:740}
      .body{font-size:18px}
      .wire{stroke:#8d9189;stroke-width:5;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1600" height="900" rx="42" fill="url(#paper)"/>
  <text x="70" y="80" class="mono" fill="#3159aa" font-size="16">One order, end to end</text>
  <text x="70" y="136" class="sans ink" font-size="48" font-weight="760" letter-spacing="-1.8">Alice gets her output now. The block decides her bill.</text>
  <text x="72" y="180" class="sans muted" font-size="22">The maximum is temporary collateral. Only Alice’s marginal contribution remains charged.</text>

  <g transform="translate(70 250)" filter="url(#shadow)">
    <rect width="320" height="370" rx="30" class="card"/>
    <text x="32" y="45" class="mono step" fill="#3159aa">1 · Alice signs</text>
    <text x="32" y="90" class="sans ink card-title">Exact output</text>
    <rect x="32" y="116" width="256" height="76" rx="20" fill="#edf1fb" stroke="#3159aa" stroke-width="2"/>
    <text x="52" y="144" class="mono muted" font-size="15">receive exactly</text>
    <text x="52" y="178" class="sans" fill="#3159aa" font-size="29" font-weight="760">10 fETH</text>
    <text x="32" y="232" class="mono muted" font-size="15">maximum input</text>
    <text x="32" y="268" class="sans ink" font-size="24" font-weight="720">12.246752 fUSD</text>
    <text x="32" y="305" class="sans muted body">payer · recipient · deadline</text>
  </g>

  <path d="M402 435H422" class="wire"/>
  <path d="M442 435 414 419V451Z" fill="#8d9189"/>

  <g transform="translate(450 250)" filter="url(#shadow)">
    <rect width="320" height="370" rx="30" class="card"/>
    <text x="32" y="45" class="mono step" fill="#3159aa">2 · Transaction executes</text>
    <text x="32" y="90" class="sans ink card-title">Output first</text>
    <circle cx="70" cy="154" r="38" fill="#3159aa"/>
    <text x="70" y="164" text-anchor="middle" class="sans" fill="#fffefa" font-size="26" font-weight="760">10</text>
    <text x="126" y="148" class="sans ink" font-size="25" font-weight="740">fETH delivered</text>
    <text x="126" y="178" class="sans muted body">before the call ends</text>
    <line x1="32" y1="215" x2="288" y2="215" stroke="#d0d3ca" stroke-width="2"/>
    <text x="32" y="253" class="mono muted" font-size="15">maximum held</text>
    <text x="32" y="288" class="sans ink" font-size="23" font-weight="720">12.246752 fUSD</text>
    <text x="32" y="313" class="sans muted" font-size="16">not the final price</text>
  </g>

  <path d="M782 435H802" class="wire"/>
  <path d="M822 435 794 419V451Z" fill="#8d9189"/>

  <g transform="translate(830 250)" filter="url(#shadow)">
    <rect width="320" height="370" rx="30" fill="#e3e8df" stroke="#8b9789" stroke-width="2"/>
    <text x="32" y="45" class="mono step" fill="#3159aa">3 · Same Ethereum block</text>
    <text x="32" y="90" class="sans ink card-title">One complete set</text>
    <rect x="32" y="116" width="256" height="44" rx="14" fill="#fbefea"/>
    <circle cx="52" cy="138" r="8" fill="#b65936"/>
    <text x="70" y="145" class="sans ink" font-size="17" font-weight="650">Eve buys 100</text>
    <rect x="32" y="170" width="256" height="44" rx="14" fill="#edf1fb"/>
    <circle cx="52" cy="192" r="8" fill="#3159aa"/>
    <text x="70" y="199" class="sans ink" font-size="17" font-weight="650">Alice buys 10</text>
    <rect x="32" y="224" width="256" height="44" rx="14" fill="#fbefea"/>
    <circle cx="52" cy="246" r="8" fill="#b65936"/>
    <text x="70" y="253" class="sans ink" font-size="17" font-weight="650">Eve sells 100</text>
    <text x="32" y="298" class="sans ink" font-size="18" font-weight="700">Opposing flow nets first.</text>
    <text x="32" y="322" class="sans muted" font-size="16">Only Alice’s residual</text>
    <text x="32" y="342" class="sans muted" font-size="16">moves the curve.</text>
  </g>

  <path d="M1162 435H1182" class="wire"/>
  <path d="M1202 435 1174 419V451Z" fill="#8d9189"/>

  <g transform="translate(1210 250)" filter="url(#shadow)">
    <rect width="320" height="370" rx="30" class="card"/>
    <text x="32" y="45" class="mono step" fill="#b65936">4 · Next block</text>
    <text x="32" y="90" class="sans ink card-title">Settle and refund</text>
    <text x="32" y="132" class="mono muted" font-size="15">Alice’s final bill</text>
    <text x="32" y="169" class="sans ink" font-size="25" font-weight="740">10.131404 fUSD</text>
    <line x1="32" y1="198" x2="288" y2="198" stroke="#d0d3ca" stroke-width="2"/>
    <text x="32" y="235" class="mono" fill="#3159aa" font-size="15">Alice’s refund</text>
    <text x="32" y="272" class="sans" fill="#3159aa" font-size="25" font-weight="740">2.115348 fUSD</text>
    <text x="32" y="311" class="sans muted" font-size="16">maximum − bill = refund</text>
  </g>

  <g transform="translate(70 650)">
    <rect width="1460" height="170" rx="30" fill="#171814"/>
    <text x="42" y="51" class="mono" fill="#9cb7ef" font-size="16">The key idea</text>
    <text x="42" y="96" class="sans" fill="#f8f5ee" font-size="32" font-weight="740">Fast output does not require permanent transaction-order pricing.</text>
    <text x="42" y="135" class="sans" fill="#bfc5ba" font-size="20">Deliver now · net the completed block set · charge the marginal bill · return the rest</text>
  </g>
</svg>
