<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Firstless execution and settlement architecture</title>
  <desc id="desc">During the signed transaction, the trader calls FirstlessRouter, which authenticates the order and unlocks PoolManager. PoolManager calls FirstlessHook, and the trader receives exact output before the transaction ends. After the Ethereum block advances, FirstlessHook finalizes the completed set, RefundRedeemer converts the backed claim to ERC-20, and the trader receives the unused maximum.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171814"/>
      <stop offset="1" stop-color="#252822"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#000" flood-opacity=".24"/>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .card{fill:#f8f5ee;stroke:#c8cbc2;stroke-width:2}
      .hook{fill:#e3e8df;stroke:#8b9789;stroke-width:2}
      .title{fill:#171814;font-size:25px;font-weight:740}
      .copy{fill:#686c65;font-size:17px}
      .step{font-size:14px}
      .wire{stroke:#aeb6aa;stroke-width:5;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1600" height="920" rx="42" fill="url(#background)"/>
  <text x="70" y="76" class="sans" fill="#f8f5ee" font-size="42" font-weight="750" letter-spacing="-1.5">One system. Two moments.</text>
  <text x="70" y="116" class="sans" fill="#bfc5ba" font-size="21">Output finishes inside the signed transaction. Billing and refund wait for the block boundary.</text>

  <rect x="50" y="158" width="1500" height="390" rx="34" fill="#202721" stroke="#3b463d" stroke-width="2"/>
  <text x="82" y="204" class="mono" fill="#9cb7ef" font-size="17">During the signed transaction</text>
  <text x="82" y="235" class="sans" fill="#bfc5ba" font-size="18">Authentication, custody accounting, and exact output are atomic.</text>

  <g transform="translate(70 268)" filter="url(#shadow)">
    <rect width="320" height="170" rx="26" class="card"/>
    <text x="30" y="42" class="mono step" fill="#3159aa">Trader</text>
    <text x="30" y="82" class="sans title">Signs exact output</text>
    <text x="30" y="117" class="sans copy">10 fETH requested</text>
    <text x="30" y="145" class="sans copy">maximum input authorized</text>
  </g>

  <path d="M402 353H422" class="wire"/>
  <path d="M442 353 414 337V369Z" fill="#aeb6aa"/>

  <g transform="translate(450 268)" filter="url(#shadow)">
    <rect width="320" height="170" rx="26" class="card"/>
    <text x="30" y="42" class="mono step" fill="#b65936">FirstlessRouter</text>
    <text x="30" y="82" class="sans title">Authenticates</text>
    <text x="30" y="117" class="sans copy">nonce · deadline · payer</text>
    <text x="30" y="145" class="sans copy">recipient · downstream call</text>
  </g>

  <path d="M782 353H802" class="wire"/>
  <path d="M822 353 794 337V369Z" fill="#aeb6aa"/>

  <g transform="translate(830 268)" filter="url(#shadow)">
    <rect width="320" height="170" rx="26" class="card"/>
    <text x="30" y="42" class="mono step" fill="#3159aa">Uniswap v4 PoolManager</text>
    <text x="30" y="82" class="sans title">Owns custody</text>
    <text x="30" y="117" class="sans copy">unlock · deltas · claims</text>
    <text x="30" y="145" class="sans copy">single accounting boundary</text>
  </g>

  <path d="M1162 353H1182" class="wire"/>
  <path d="M1202 353 1174 337V369Z" fill="#aeb6aa"/>

  <g transform="translate(1210 268)" filter="url(#shadow)">
    <rect width="320" height="170" rx="26" class="hook"/>
    <text x="30" y="42" class="mono step" fill="#3159aa">FirstlessHook</text>
    <text x="30" y="82" class="sans title">Executes the order</text>
    <text x="30" y="117" class="sans copy">sends 10 fETH now</text>
    <text x="30" y="145" class="sans copy">holds maximum · records set</text>
  </g>

  <rect x="82" y="466" width="1436" height="54" rx="27" fill="#3159aa"/>
  <text x="800" y="501" text-anchor="middle" class="sans" fill="#fffefa" font-size="21" font-weight="700">Transaction ends: Alice already has usable output.</text>

  <rect x="50" y="570" width="1500" height="310" rx="34" fill="#1d211c" stroke="#3b403a" stroke-width="2"/>
  <text x="82" y="616" class="mono" fill="#e2a58d" font-size="17">After block.number advances</text>
  <text x="82" y="647" class="sans" fill="#bfc5ba" font-size="18">The completed set fixes the bill; the unused maximum stays backed until redemption.</text>

  <g transform="translate(70 680)" filter="url(#shadow)">
    <rect width="320" height="170" rx="26" fill="#353a34" stroke="#596159" stroke-width="2"/>
    <text x="30" y="42" class="mono step" fill="#bfc5ba">Ethereum clock</text>
    <text x="30" y="82" class="sans" fill="#f8f5ee" font-size="25" font-weight="740">Set closes</text>
    <text x="30" y="117" class="sans" fill="#bfc5ba" font-size="17">all opted-in orders known</text>
    <text x="30" y="145" class="sans" fill="#bfc5ba" font-size="17">opening reserves fixed</text>
  </g>

  <path d="M402 765H422" class="wire"/>
  <path d="M442 765 414 749V781Z" fill="#aeb6aa"/>

  <g transform="translate(450 680)" filter="url(#shadow)">
    <rect width="320" height="170" rx="26" class="hook"/>
    <text x="30" y="42" class="mono step" fill="#b65936">FirstlessHook</text>
    <text x="30" y="82" class="sans title">Computes each bill</text>
    <text x="30" y="117" class="sans copy">full set − set without order</text>
    <text x="30" y="145" class="sans copy">refund liability stays backed</text>
  </g>

  <path d="M782 765H802" class="wire"/>
  <path d="M822 765 794 749V781Z" fill="#aeb6aa"/>

  <g transform="translate(830 680)" filter="url(#shadow)">
    <rect width="320" height="170" rx="26" class="card"/>
    <text x="30" y="42" class="mono step" fill="#3159aa">RefundRedeemer</text>
    <text x="30" y="82" class="sans title">Redeems the claim</text>
    <text x="30" y="117" class="sans copy">ERC-6909 claim</text>
    <text x="30" y="145" class="sans copy">converted to ERC-20</text>
  </g>

  <path d="M1162 765H1182" class="wire"/>
  <path d="M1202 765 1174 749V781Z" fill="#aeb6aa"/>

  <g transform="translate(1210 680)" filter="url(#shadow)">
    <rect width="320" height="170" rx="26" class="card"/>
    <text x="30" y="42" class="mono step" fill="#3159aa">Trader</text>
    <text x="30" y="82" class="sans title">Receives the rest</text>
    <text x="30" y="117" class="sans copy">2.115348 fUSD refund</text>
    <text x="30" y="145" class="sans copy">only final bill stays charged</text>
  </g>
</svg>
